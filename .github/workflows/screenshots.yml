name: Screenshots

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install VHS
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          version: v0.11.0
          install-fonts: true

      - name: Record screenshots
        run: VHS_BIN="$(command -v vhs)" npm run screenshot

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: screenshots/regenerate
          delete-branch: true
          add-paths: |
            screenshot/*.gif
            screenshot/*.png
          commit-message: "docs: regenerate README screenshots"
          title: "docs: regenerate README screenshots"
          body: Screenshots re-recorded from `screenshot/tapes` by the Screenshots workflow.
